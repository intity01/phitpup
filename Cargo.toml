[workspace]
resolver = "3"
members = ["crates/phitpup-core", "crates/phitpup", "crates/phitpup-update", "crates/phitpup-web", "xtask"]
default-members = ["crates/phitpup-core", "crates/phitpup", "crates/phitpup-update"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
