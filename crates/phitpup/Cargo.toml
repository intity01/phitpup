[package]
name = "phitpup"
description = "ผิดปุ๊บ: fix text typed with the wrong keyboard layout (Thai ⇄ English) on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phitpup-core = { path = "../phitpup-core" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
