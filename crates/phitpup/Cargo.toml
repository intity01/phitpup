[package]
name = "phitpup"
description = "ผิดปุ๊บ: fix text typed with the wrong keyboard layout (Thai ⇄ English) on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phitpup-core = { path = "../phitpup-core" }

[build-dependencies]
phitpup-core = { path = "../phitpup-core" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Only the Microsoft Store (MSIX) build uses this: "Start with Windows" there
# is a StartupTask, and "Check for updates" asks the Store; only the WinRT API
# does either.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Services_Store",
    "Win32_Foundation",
    "Win32_UI_Shell",
]

# The Store's list of updates and its download's progress handler; `windows`
# uses these crates but does not re-export them.
[target.'cfg(windows)'.dependencies.windows-collections]
version = "0.3.2"

[target.'cfg(windows)'.dependencies.windows-future]
version = "0.3.2"
